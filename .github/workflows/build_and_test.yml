name: build_and_test

on:
  push:
    tags:
      - '*'
    branches:
      - main
      - '*-devel'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - '**'
  workflow_dispatch:

# Do not run multiple jobs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pixi_build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && (github.ref_name == 'main' || endsWith(github.ref_name, '-devel')) }}
          frozen: true
          manifest-path: pixi.toml
      - name: Build repository
        run: pixi run build
      - name: Run tests
        run: pixi run test
      - name: Build docs
        run: pixi run -e docs build-docs
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  # If building main, push a documentation update to pages
  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pixi_build_and_test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
